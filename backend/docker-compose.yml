# Каталог «Авто в наличии» на сервере: API + Caddy (сам выпускает https-сертификат).
#   cd /opt/savva/backend && docker compose up -d --build
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data          # машины и фото — хранятся на диске сервера

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      # порт 80 на этом сервере занят nginx — работаем только через 443,
      # сертификат Caddy получает через TLS-ALPN (тоже порт 443)
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
