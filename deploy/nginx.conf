# Сайт статический: nginx просто отдаёт файлы, ничего собирать не нужно.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/savva
#   sudo ln -s /etc/nginx/sites-available/savva /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Блок на 443 и переадресацию с http допишет certbot — руками этого делать
# не нужно, см. DEPLOY.md.

server {
    listen      80;
    listen      [::]:80;

    # ЗАМЕНИТЬ на свой домен (оба места)
    server_name example.ru www.example.ru;

    root  /var/www/savva;
    index index.html;

    # Отдаём свою 404. Адрес в строке браузера при этом остаётся тем,
    # который запросили, — страница на это рассчитана.
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Фотографии и видео не меняются от захода к заходу
    location ~* \.(jpg|jpeg|png|webp|svg|mp4|webm|woff2)$ {
        expires    7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Разметку и стили жмём; jpg и mp4 уже сжаты, их трогать бессмысленно
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/html text/css application/javascript image/svg+xml application/json;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
