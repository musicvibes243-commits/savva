# nginx внутри контейнера Timeweb App Platform. HTTPS и домен делает сама платформа.
server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Видео и картинки не меняются — кэшируем на неделю
    location ~* \.(jpg|jpeg|png|webp|svg|mp4|webm|woff2)$ {
        expires    7d;
        add_header Cache-Control "public";
        access_log off;
    }

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/html text/css application/javascript image/svg+xml application/json;
}
