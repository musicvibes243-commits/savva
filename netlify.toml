# Netlify публикует только сайт «Автовоз-312» из папки avtovoz/.
# Сайт статический: собирать ничего не нужно.
[build]
  publish = "avtovoz"
  command = ""

# Видео и картинки не меняются — кэшируем на неделю
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
